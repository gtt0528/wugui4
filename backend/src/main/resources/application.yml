server:
  port: 8081

spring:
  application:
    name: wugui4-backend
  datasource:
    url: jdbc:mysql://localhost:3306/wugui4?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: "165016"
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update        # 开发期自动建表；上线前改为 validate + 手写迁移
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

wugui4:
  jwt:
    # 生产环境务必换成随机长字符串并放进环境变量
    secret: "wugui4-dev-secret-please-change-in-production-0123456789abcdef"
    expire-hours: 168         # 7 天
  wx:
    # 微信小游戏 appid/secret，登录微信公众平台 → 开发管理 → 开发设置 里拿
    # 不填时 /api/auth/wx 会返回 501，前端可先用游客登录
    appid: ""
    secret: ""
  internal-token: "wugui4-internal-dev-token"   # gameserver 服务间调用用，与 gameserver 配置保持一致
